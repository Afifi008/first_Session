name: test_workflow
on: 
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/*'
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: download code
        uses: actions/checkout@v7
      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: install requirements
        run: pip install -r requirements.txt
      - name: run first test case 
        run: pytest tests/test_data_quality.py -v 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: download code
        uses: actions/checkout@v7
      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: install requirements
        run: pip install -r requirements.txt
      - name: run build script
        run: python build_output.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts_files_generated
          path: artifact/*.csv

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: download code
        uses: actions/checkout@v7
      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: install requirements
        run: pip install -r requirements.txt
      - name: print deploy
        run: echo "done deploying"
   